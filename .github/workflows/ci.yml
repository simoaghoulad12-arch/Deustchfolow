name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Placeholder connection string so Prisma can validate/generate the
  # client. Not a real secret — no database is contacted in this pipeline.
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/deutschflow_ci'
  DIRECT_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/deutschflow_ci'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
