<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keine Verbindung · Smart Deutsch Akademie</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 16px/1.5 system-ui, sans-serif;
        background: #1b1d21; color: #f4f4f5; text-align: center; padding: 16px; }
      main { max-width: 26rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      button { min-height: 44px; padding: 0 20px; margin-top: 16px; border: 0; border-radius: 10px; background: #c8102e; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Keine Internetverbindung</h1>
      <p>Die App braucht Internet, damit Schülerdaten nicht auf dem Gerät gespeichert werden.</p>
      <p lang="ar" dir="rtl">ما كاينش الإنترنت. التطبيق خاصو الإنترنت باش ما تتخزنش معطيات الطلبة فالجهاز.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
