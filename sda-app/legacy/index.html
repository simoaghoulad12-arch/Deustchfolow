<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Deutsch Akademie – Internal Academy System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f4f5;--panel:#ffffff;--ink:#141518;--muted:#5d6068;--line:#e2e3e7;--anth:#1b1d21;--anth2:#26292f;--anth-ink:#f4f4f5;--red:#c8102e;--red-soft:#fbe8eb;--gold:#b08d3c;--gold-soft:#f6f1e4;--ok:#2d7a4f;--ok-soft:#e3f2e8;--warn:#9a6a00;--warn-soft:#fbf3dc;--say:#f6f6f7;--now:#fff4d6;--navy:#1b1d21;--navy-ink:#f4f4f5;--teal:#1b1d21;--teal-soft:#eef0f3;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--panel:#1a1c20;--ink:#ececee;--muted:#a0a3ab;--line:#2c2f35;--anth:#0b0c0e;--anth2:#17191c;--anth-ink:#ececee;--red:#ef4a5f;--red-soft:#3a1a20;--gold:#d2b067;--gold-soft:#2f2a1c;--ok:#52b882;--ok-soft:#173225;--warn:#e0b44a;--warn-soft:#30280f;--say:#22252a;--now:#3a3218;--navy:#0b0c0e;--navy-ink:#ececee;--teal:#0b0c0e;--teal-soft:#24272c}}
:root[data-theme="dark"]{--bg:#111214;--panel:#1a1c20;--ink:#ececee;--muted:#a0a3ab;--line:#2c2f35;--anth:#0b0c0e;--anth2:#17191c;--anth-ink:#ececee;--red:#ef4a5f;--red-soft:#3a1a20;--gold:#d2b067;--gold-soft:#2f2a1c;--ok:#52b882;--ok-soft:#173225;--warn:#e0b44a;--warn-soft:#30280f;--say:#22252a;--now:#3a3218;--navy:#0b0c0e;--navy-ink:#ececee;--teal:#0b0c0e;--teal-soft:#24272c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;line-height:1.2;margin:0}
.ar{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;direction:rtl;text-align:right}
.muted{color:var(--muted);font-size:14px}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--anth);color:var(--anth-ink);display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px solid var(--red)}
.hbm{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:10px;min-width:44px;min-height:44px;font-size:20px;color:inherit}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;line-height:1.15;white-space:nowrap}
.brand small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:11px;letter-spacing:0;opacity:.7}
.hsearch{flex:1;min-width:0;display:flex}
.hsearch input{width:100%;max-width:440px;margin-left:auto;background:var(--anth2);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;min-height:42px;font-size:16px;color:var(--anth-ink)}
.hsearch input::placeholder{color:rgba(255,255,255,.55)}
.hbtns{display:flex;gap:6px;align-items:center}
.hb{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px;min-height:42px;font-size:13px;color:inherit;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--gold)}
.dot.on{background:#3fbf7f}

/* Rahmen */
.shell{display:block}
.side{display:none}
main{max-width:860px;margin:0 auto;padding:14px 12px 110px}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:270px 1fr}
  .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);height:calc(100vh - 63px);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 30px}
  .hbm,.nav{display:none!important}
  main{padding:22px 24px 60px}
}
@media (max-width:640px){.hsearch{display:none}.brand small{display:none}}
.ng{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 10px 6px}
.ni{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 10px;min-height:42px;font-size:15px}
.ni:hover{background:var(--bg)}
.ni[aria-current="page"]{background:var(--anth);color:var(--anth-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--red)}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45)}
.drawerin{position:absolute;top:0;bottom:0;left:0;width:min(86vw,320px);overflow:auto;background:var(--panel);padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 20px)}

/* Bausteine */
.hero{background:var(--anth);color:var(--anth-ink);border-radius:18px;padding:22px 20px;margin-bottom:14px;border-left:6px solid var(--red)}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0;opacity:.9}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:600;opacity:.75}
.ph1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 2px 12px}
.ph1 h1{font-size:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.pad{padding:14px 16px}
.card h2{font-size:19px;margin-bottom:6px}
.card h3{font-size:16px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-align:center}
.btn.gold,.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.bar-track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:99px;transition:width .25s}
.bar-fill.done{background:var(--ok)}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.tag.g{background:var(--anth);color:var(--anth-ink)}
.tag.s{background:var(--red-soft);color:var(--red)}
.tag.t{background:var(--say);color:var(--ink);border:1px solid var(--line)}
.tag.x{background:var(--gold-soft);color:var(--gold)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--say);border:1px solid var(--line)}
.st{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.st-ex{background:var(--say);color:var(--ink);border:1px solid var(--line)}
.st-im{background:var(--anth);color:var(--anth-ink)}
.st-pr{background:var(--gold-soft);color:var(--gold)}
.st-od{background:var(--red-soft);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:96px}
.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;margin-bottom:4px}
.tile .num{font-size:24px;font-weight:700}
.tile:hover{border-color:var(--red)}
.path{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.pstep{flex:1 0 120px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;min-height:84px}
.pstep b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.pstep span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.pstep.de{background:var(--anth);color:var(--anth-ink);border-color:var(--anth)}
.pstep.de span{color:rgba(255,255,255,.7)}
.arr{align-self:center;color:var(--muted)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;min-height:40px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--anth);color:var(--anth-ink);border-color:var(--anth)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:46px;font-weight:600;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--anth);color:var(--anth-ink);border-color:var(--anth);box-shadow:inset 0 -3px 0 var(--red)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.two button,.seg.three button{font-family:inherit;font-size:15px}
.lo{margin:6px 0 0;padding-left:20px}
.lo li{margin-bottom:4px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.steps9{display:grid;gap:10px}
.s9{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.s9 .n{width:44px;height:44px;border-radius:12px;background:var(--anth);color:var(--anth-ink);display:grid;place-items:center;font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.rec{border-top:1px solid var(--line);padding:12px 0}
.rec:first-child{border-top:0}
.rec h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;margin-top:8px;font-size:12px}
.skills .bar-track{height:6px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;font-size:16px;color:var(--ink);width:100%}
.form textarea{min-height:80px;resize:vertical}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.form .row2{grid-template-columns:1fr}}
.cbl{display:flex;flex-wrap:wrap;gap:8px}
.cbl label{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px;color:var(--ink)}
.formbtns{display:flex;gap:8px;flex-wrap:wrap}
.inl{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-height:36px}
.sres{border-top:1px solid var(--line);padding:10px 0}
.sres button{background:transparent;border:0;padding:0;text-align:left;width:100%}
.sres b{display:block}
mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:3px}
.note2{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* Heute / Rollen */
.today{border:2px solid var(--red)}
.today .lbl{font-size:13px;color:var(--muted)}
.today h2{font-size:22px;margin:4px 0 8px}
.today .btn{margin-top:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick button{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:60px;padding:10px;font-weight:600;font-size:15px}
.prep{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:grid;gap:10px}
.who button{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;min-height:76px}
.who button b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.who button span{color:var(--muted);font-size:14px}
.who button:hover{border-color:var(--red)}

/* Module & Stunden */
.weekbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:14px 16px;text-align:left;min-height:56px}
.weekbtn b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.weekbtn .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.rows{padding:0 8px 8px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:10px 8px;min-height:58px}
.row:hover{background:var(--bg)}
.node{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--c,var(--anth)) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.node::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--panel)}
.node.full{background:var(--ok)}
.node.full::after{display:none}
.node span{position:relative;z-index:1;font-size:13px;color:#fff;font-weight:700}
.dt .d1{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.dt .d2{font-weight:600;font-size:15px;line-height:1.3}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.back{background:transparent;border:0;padding:8px 4px;font-weight:600;min-height:44px;font-size:16px}
.ltitle{font-size:24px;margin:2px 0 8px}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.live{background:var(--anth);color:var(--anth-ink);border-radius:16px;padding:14px 16px;margin:10px 0;border-left:5px solid var(--red)}
.live .big{font-size:18px;font-weight:600;line-height:1.35;margin:4px 0}
.live .nx{opacity:.8;font-size:14px}
.fstep{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
.fstep .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.fstep .big{font-size:21px;line-height:1.35;font-weight:500}
.fstep .a{display:block;margin-top:10px;font-size:17px;color:var(--muted)}
.fstep.isdone{border-color:var(--ok);background:var(--ok-soft)}
.fbtns{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-top:14px}
.fbtns .btn{min-height:58px;font-size:17px}
.next3{margin:6px 0 0;padding:0;list-style:none}
.next3 li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.ph{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.ph::after{content:"";flex:1;height:1px;background:var(--line)}
.it{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start;border-radius:10px}
.it.now{background:var(--now)}
.it input{position:absolute;opacity:0;width:1px;height:1px}
.bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:2px;background:var(--panel)}
.it input:focus-visible+.bx{outline:3px solid var(--red);outline-offset:2px}
.it input:checked+.bx{background:var(--ok);border-color:var(--ok)}
.it input:checked+.bx::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
.tm{font-variant-numeric:tabular-nums;font-weight:600}
.rb{border-radius:999px;padding:0 8px;font-size:11px;font-weight:600;line-height:18px}
.rb.H{background:var(--anth);color:var(--anth-ink)}
.rb.A{background:var(--red);color:#fff}
.rb.N{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.rb.T{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.rb.ALL{background:var(--line);color:var(--ink)}
.tx{font-size:15px;line-height:1.4}
.tx .a{display:block;margin-top:2px;font-size:14px;color:var(--muted)}
.it input:checked~.cx .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.done-card{text-align:center;padding:26px 18px}
.done-card h2{font-size:24px;margin-bottom:8px}
.sch{display:flex;gap:10px;align-items:baseline;margin:20px 0 6px;font-size:17px}
.sch .tm{background:var(--anth);color:var(--anth-ink);border-radius:8px;padding:0 8px;font-size:13px}
.say{background:var(--say);border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:17px;line-height:1.5}
.dj{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.ex{margin:8px 0;padding-left:22px}
.ex li{margin-bottom:8px}
details.sol{margin-top:4px}
details.sol summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px;display:flex;align-items:center}
details.sol div{background:var(--ok-soft);border-radius:8px;padding:6px 10px;font-weight:600}
.note{display:grid;gap:4px;margin:12px 0;font-size:14px;color:var(--muted)}
.note input{font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);color:var(--ink);width:100%}
.gp{border-top:1px solid var(--line);padding:12px 0}
.gp h3{font-size:16px;margin-bottom:4px}
details.card summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;min-height:54px;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card .body{padding:0 16px 14px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
.tpl{background:var(--say);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:14px;white-space:pre-wrap}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin-bottom:5px}
.field{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center;margin:8px 0}
.field input[type=date]{font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);color:var(--ink);width:100%}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:transparent;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{stroke:var(--red)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--anth);color:var(--anth-ink);padding:10px 16px;border-radius:12px;z-index:70;font-size:14px;max-width:90vw}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.top,.nav,.side,.btn{display:none!important}.shell{display:block}}
</style>
</head>
<body>

["5–15","Die Ziele von A2","A2 ist die zweite Stufe im Europäischen Referenzrahmen.¶Nach A2 könnt ihr euch im Alltag verständigen: beim Einkaufen, beim Arzt, bei der Arbeit, mit Nachbarn und am Telefon.¶Hören: Ihr versteht kurze, klare Gespräche. Lesen: Ihr versteht kurze Texte und E-Mails. Sprechen: Ihr erzählt über Vergangenes und über Pläne. Schreiben: Ihr schreibt kurze Nachrichten und E-Mails.¶Wichtige Grammatik in A2: das Perfekt, Nebensätze mit weil und dass, Wechselpräpositionen und der Komparativ.¶Jetzt eine kurze Umfrage im Chat: Was möchtet ihr nach A2 können? Arbeit, Ausbildung, Alltag, Prüfung oder Familie?","A2 هو المستوى الثاني. من بعدو غادي تقدرو تتفاهمو فالحياة اليومية: السوق، الطبيب، الخدمة، التلفون."],
["15–23","So läuft der Kurs ab","Unser Kurs hat eine klare Struktur. Ihr müsst nicht raten, was als Nächstes kommt.¶Wir lernen zehn Stunden pro Woche: acht Stunden Grammatik und Vokabeln, von Montag bis Donnerstag, und zwei Stunden Sprechen mit Muttersprachlern.¶Zuerst klären wir euer Niveau und euer Ziel. Dann lernen wir Schritt für Schritt: Erklärung, Übungen, Hausaufgaben mit Feedback in unserer Community.¶Regelmäßig machen wir Mini-Tests und Modelltests im Stil der Prüfung.¶Das Besondere bei uns: Ihr sprecht regelmäßig mit echten Muttersprachlern. So bleibt Deutsch nicht nur Theorie, sondern ihr benutzt es wirklich.","الكورس منظم: 8 ساعات قواعد من الإثنين للخميس + ساعتين تحدث مع ناطقين أصليين. وكاين تمارين وواجبات واختبارات."],
["23–48","Mini-Lektion: Das Perfekt","Jetzt fangen wir mit dem ersten Thema an. Wir lernen das Perfekt. Damit könnt ihr sofort erzählen, was ihr gestern oder am Wochenende gemacht habt.¶Das Perfekt besteht aus haben oder sein und dem Partizip II. Haben oder sein steht auf Position 2, das Partizip am Satzende.¶Beispiel: Ich habe gestern Deutsch gelernt. Er ist nach Frankfurt gefahren.¶Haben benutzen wir bei den meisten Verben. Sein benutzen wir bei Bewegung und Zustandsänderung, zum Beispiel gehen, fahren, aufstehen.¶Regelmäßige Verben: machen, gemacht. Lernen, gelernt. Unregelmäßige Verben: essen, gegessen. Trinken, getrunken. Mit sein: gehen, gegangen. Fahren, gefahren.¶Jetzt eine Übung: Übung A, Lückentext: Gestern ___ ich Deutsch ___. Er ___ nach Frankfurt ___. Wir ___ Pizza ___. Lösungen: habe gelernt. Ist gefahren. Haben gegessen.","الـ Perfekt = haben أو sein + Partizip II. مع الحركة كنستعملو sein، ومع الباقي haben."],
["48–55","Sprechen","Jetzt sprecht ihr. Keine Angst vor Fehlern. Wir helfen euch.¶Wir teilen euch in zwei Gruppen. Die Frage lautet: Was hast du am Wochenende gemacht?¶Hilfe: Am Wochenende habe ich … gearbeitet, gelernt, gekocht. Am Samstag bin ich … in die Stadt gefahren.¶Wir loben zuerst und korrigieren nur ein oder zwei Fehler.","المجموعات الصغيرة: الناطق الأصلي مع كل مجموعة، وكل واحد كيجاوب بجملة أو جوج."],

function dayRole(L){
  var me=state.me;if(me==="N")return"N";if(!me||me==="ALL"||state.showAll)return null;
  var d=L.day;
  if(d==="Mo"||d==="Mi")return me==="L1"?"H":"A";
  if(d==="Di"||d==="Do")return me==="L1"?"A":"H";
  if(d==="Fr")return me==="L1"?"A":"Z";
  if(d==="Sa")return me==="L2"?"A":"Z";
  return me==="L1"?"H":"A";
}
function who(L){var r=dayRole(L);
  if(r===null)return["Alle Aufgaben","كل المهام"];
  if(r==="H")return["Hauptlehrkraft","الأستاذ الرئيسي"];
  if(r==="A")return["Assistenz","المساعد"];
  if(r==="Z")return["Zuhören, Fehler notieren","الاستماع وتسجيل الأخطاء"];
  return["Muttersprachler/in","الناطق الأصلي"];}
function whoT(L){var p=who(L);return state.lang==="ar"?p[1]:p[0];}
function visibleFor(L,x){var r=dayRole(L);if(r===null||x.r==="ALL")return true;if(r==="N")return x.r==="N";if(r==="Z")return x.r==="T";return x.r===r||x.r==="T";}
function steps(L){var a=[];L.groups.forEach(function(g){var name=g.ph?PH[g.ph]:g.name;g.items.forEach(function(x){if(visibleFor(L,x))a.push({x:x,g:name});});});return a;}
function prog(L){var s=steps(L),d=0;s.forEach(function(o){if(state.done[o.x.id])d++;});return{t:s.length,d:d};}
function pct(p){return p.t?Math.round(100*p.d/p.t):0;}
function weekProg(lv,wi){var t=0,d=0;DAYS.forEach(function(x){var p=prog(getLesson(lv,wi,x));t+=p.t;d+=p.d;});return{t:t,d:d};}
function lvProg(lv){var p=prog(getStart(lv)),t=p.t,d=p.d;lv.weeks.forEach(function(w,wi){var q=weekProg(lv,wi);t+=q.t;d+=q.d;});return{t:t,d:d};}
function lessonsOf(lv){var a=[getStart(lv)];lv.weeks.forEach(function(w,wi){DAYS.forEach(function(d){a.push(getLesson(lv,wi,d));});});return a;}
function nextOpen(after){var seen=!after;for(var i=0;i<LV.length;i++){var ls=lessonsOf(LV[i]);for(var j=0;j<ls.length;j++){if(!seen){if(ls[j].id===after)seen=true;continue;}var p=prog(ls[j]);if(p.t>0&&p.d<p.t)return{lv:LV[i],L:ls[j]};}}return null;}
function lvOf(L){return LV.filter(function(x){return x.k===L.lv;})[0];}

/* ============================ DATUM: Welche Stunde ist heute? ============================ */
function mondayOf(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d;}
function lessonAt(lv,date){
  var s=state.start&&state.start[lv.k];if(!s)return null;
  var m=mondayOf(s),t=new Date(date.getFullYear(),date.getMonth(),date.getDate()),days=Math.round((t-m)/86400000);
  if(days<0)return{state:"before"};var wi=Math.floor(days/7);if(wi>=lv.weeks.length)return{state:"after"};
  var d=DAYS[days%7];return{state:"ok",lv:lv,wi:wi,d:d,L:getLesson(lv,wi,d)};
}

/* ============================ TIMER ============================ */
function rng(t){var m=/^(\d+)[–-](\d+)$/.exec(t);return m?[+m[1],+m[2]]:null;}
function spanOf(L){var mx=0;L.groups.forEach(function(g){g.items.forEach(function(x){var r=rng(x.t);if(r&&r[1]>mx)mx=r[1];});});return mx;}
function itxt(x){return state.lang==="ar"&&x.ar?x.ar:x.de;}
function minuteNow(){return Math.floor((Date.now()-state.live.at)/60000);}
function liveInner(L){
  var min=minuteNow(),sp=spanOf(L),now=[],nx=null;
  steps(L).forEach(function(o){var r=rng(o.x.t);if(!r)return;if(min>=r[0]&&min<r[1])now.push(o.x);else if(r[0]>min&&(!nx||r[0]<nx.a))nx={a:r[0],x:o.x};});
  var h='<div>'+(state.lang==="ar"?'الدقيقة ':'Minute ')+'<b>'+min+'</b> / '+sp+(min<sp?' · '+(sp-min)+' Min.':'')+'</div>';
  if(now.length){h+='<div class="big'+(state.lang==="ar"?" ar":"")+'" '+(state.lang==="ar"?'dir="rtl"':'')+'>'+now.slice(0,3).map(function(x){return esc(itxt(x));}).join("<br>")+'</div>';}
  else if(min>=sp){h+='<div class="big">'+(state.lang==="ar"?"الحصة سالات. شوف الخطوات اللي من بعد.":"Die Stunde ist vorbei. Weiter mit dem Nachher-Teil.")+'</div>';}

}
function liveBlock(L){

  return'<div class="live"><div id="liveinner">'+liveInner(L)+'</div><div style="margin-top:8px"><button class="btn small" type="button" data-act="stop">'+U("stop")+'</button></div></div>';
}
function updateLive(){

  var el=document.getElementById("liveinner");if(el)el.innerHTML=liveInner(L);

  if(document.querySelectorAll){Array.prototype.forEach.call(document.querySelectorAll(".it[data-a]"),function(n){var a=+n.getAttribute("data-a"),b=+n.getAttribute("data-b");if(min>=a&&min<b)n.classList.add("now");else n.classList.remove("now");});}

  return h+'</div></section>';
}
function pageLessonV2(){
  var h=pageLesson(),L=findLesson(state.cur);
  if(L&&L.lv&&L.wi!==undefined&&L.day){
    var lv=lvOf(L),lo=loOf(lv,L.wi),k=h.indexOf("</div>",h.indexOf('class="ltitle"'));
    if(k>0&&lo.length)h=h.slice(0,k+6)+'<div class="facts"><b>Lernziel der Einheit</b> '+sb("IM")+'<ul class="lo">'+lo.map(function(x){return"<li>"+esc(x)+"</li>";}).join("")+'</ul></div>'+h.slice(k+6);
    if(L.type==="g"||L.type==="s")h+='<div style="margin-top:12px"><button class="btn primary full" type="button" data-act="doc-new" data-id="'+esc(L.id)+'">Stunde dokumentieren</button></div>';
  }
  return h;
}

/* ============================ V2: RENDER ============================ */
var app,navEl,hbEl,toastEl,confirmReset=false,tickId=null;
function render(top){
  var y=window.pageYOffset||0,h;pendingRender=false;
  if(!state.page)state.page="dash";
  if(!state.me)h=pageWho();
  else if(state.cur==="guide")h=pageGuide();
  else if(state.cur)h=pageLessonV2();
  else{var P={dash:pageDash,std:pageStd,cur:pageCur,lo:pageLO,lsys:pageLsys,play:pagePlay,prog:pageProg,err:pageErr,hw:pageHw,de:pageDE,onb:pageOnb,doc:pageDoc,qc:pageQC,mat:pageMat,dec:pageDec,ops:pageOps,set:pageSet,search:pageSearch};h=(P[state.page]||pageDash)();}
  chrome();app.innerHTML=h;save();
  window.scrollTo(0,top?0:y);
  updateLive();
}
function toast(m){if(!toastEl)return;toastEl.textContent=m;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.hidden=true;},2200);}
function setupLesson(){if(cache.setup)return cache.setup;cache.setup={id:"setup",type:"x",title:"Plattformen einrichten (einmalig)",dur:"einmalig",groups:finish("setup",setupGroups())};return cache.setup;}
function findLesson(id){
  if(!id)return null;if(cache[id])return cache[id];
  if(id==="setup")return setupLesson();
  if(id==="probe.gp")return probeLessons().gp;if(id==="probe.ps")return probeLessons().ps;if(id==="onb")return onbLesson();if(id==="dec")return openLesson();
  var p=id.split("."),lv=LV.filter(function(x){return x.k===p[0];})[0];if(!lv)return null;
  if(p[1]==="start")return getStart(lv);
  var wi=parseInt(p[1],10)-1;if(isNaN(wi)||!lv.weeks[wi]||DAYS.indexOf(p[2])<0)return null;
  return getLesson(lv,wi,p[2]);
}
function clearLesson(L){L.groups.forEach(function(g){g.items.forEach(function(x){delete state.done[x.id];});});delete state.idx[L.id];}
function copyTpl(i){
  var txt=TPL[i][1];
  function fb(){try{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);toast(ok?"Kopiert":"Text markieren und kopieren");}catch(e){toast("Text markieren und kopieren");}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Kopiert");},fb);}else fb();}catch(e){fb();}
}
function advance(L,from){var st=steps(L),n=firstUndone(st,from+1);state.idx[L.id]=n===-1?null:n;}
function closeDrawer(){var d=document.getElementById("drawer");if(d)d.hidden=true;}
function go(page){state.cur=null;state.form=null;state.page=page;closeDrawer();render(true);}

function saveStudent(id){
  var r=id?Object.assign({},findRec("students",id)):{id:newId(),created:todayISO()};
  r.name=fv("f_name");r.level=fv("f_level")||"A1";r.start=fv("f_start");r.module=fv("f_module");
  r.skills={gr:+fv("f_gr")||0,wo:+fv("f_wo")||0,sp:+fv("f_sp")||0,ho:+fv("f_ho")||0,le:+fv("f_le")||0,sc:+fv("f_sc")||0};
  r.strengths=fv("f_str");r.weaknesses=fv("f_weak");r.goals=fv("f_goals");
  if(!r.name){toast("Bitte einen Namen eingeben");return;}
  putRec("students",r);state.form=null;render();toast("Gespeichert");
}
function saveError(id){
  var r=id?Object.assign({},findRec("errors",id)):{id:newId()};
  r.student=fv("f_stu");r.date=fv("f_date")||todayISO();r.error=fv("f_err");r.correction=fv("f_cor");r.category=fv("f_cat")||"Grammatik";r.status=fv("f_st")||"offen";
  if(!r.student||!r.error){toast("Schüler und Fehler ausfüllen");return;}
  putRec("errors",r);state.form=null;render();toast("Gespeichert");
}
function saveHw(id){
  var stu=fv("f_stu"),base={task:fv("f_task"),goal:fv("f_goal"),deadline:fv("f_dl"),status:fv("f_st")||"Offen",feedback:fv("f_fb")};
  if(!stu||!base.task){toast("Schüler und Aufgabe ausfüllen");return;}
  if(stu.indexOf("ALL:")===0){var k=stu.slice(4),n=0;DATA.students.filter(function(s){return s.level===k;}).forEach(function(s){putRec("homework",Object.assign({id:newId(),student:s.id},base));n++;});state.form=null;render();toast(n+" Hausaufgaben angelegt");return;}
  var r=id?Object.assign({},findRec("homework",id),base):Object.assign({id:newId()},base);r.student=stu;
  putRec("homework",r);state.form=null;render();toast("Gespeichert");
}
function saveDoc(id){
  var level=fv("f_level")||"A1",lessonId=fv("f_lesson"),L=lessonId?findLesson(lessonId):null;
  var stus=DATA.students.filter(function(s){return s.level===level;}),pres=checkedVals('input[data-present]'),abs=stus.map(function(s){return s.id;}).filter(function(x){return pres.indexOf(x)<0;});
  var r=id?Object.assign({},findRec("docs",id)):{id:newId()};
  r.date=fv("f_date")||todayISO();r.teacher=fv("f_teacher");r.level=level;r.lessonId=lessonId;r.lessonTitle=L?L.title:"";r.present=pres;r.absent=abs;
  r.covered=fv("f_cov");r.canNow=fv("f_can");r.errors=fv("f_errs");r.homework=fv("f_hw");r.next=fv("f_next");r.material=fv("f_mat");r.problems=fv("f_prob");
  var all=document.getElementById("f_hwall"),mk=all&&all.checked&&r.homework;
  putRec("docs",r);
  if(mk)pres.forEach(function(sid){putRec("homework",{id:newId(),student:sid,task:r.homework,goal:r.lessonTitle,deadline:"",status:"Offen",feedback:""});});
  if(lessonId&&r.material&&r.material!==getNote(lessonId))putRec("materials",{id:lessonId,note:r.material});
  state.form=null;render();toast("Dokumentation gespeichert");
}

document.addEventListener("DOMContentLoaded",function(){
  app=document.getElementById("app");navEl=document.getElementById("nav");hbEl=document.getElementById("hbtns");toastEl=document.getElementById("toast");
  if(state.live&&Date.now()-state.live.at>5*3600000)state.live=null;
  state.form=null;if(!state.page)state.page="dash";
  loadLocal();
  var qi=document.getElementById("q");if(qi){qi.value=state.q||"";qi.addEventListener("input",function(){state.q=qi.value;state.cur=null;state.page="search";render(true);});}
  document.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("[data-act]"):null;
    if(!b){var dr=document.getElementById("drawer");if(dr&&!dr.hidden&&e.target===dr)closeDrawer();return;}
    var a=b.getAttribute("data-act"),id=b.getAttribute("data-id"),L=state.cur?findLesson(state.cur):null;
    if(a!=="resetall")confirmReset=false;
    if(a==="menu"){var d=document.getElementById("drawer");if(d)d.hidden=!d.hidden;return;}
    if(a==="go"){go(id);return;}
    if(a==="nav"){go(NAVMAP[id]||id);return;}
    if(a==="golv"){state.curLv=id;go("cur");return;}
    if(a==="me"){state.me=id;state.page="dash";render(true);}
    else if(a==="chgme"){state.me=null;state.cur=null;render(true);}
    else if(a==="open"){state.cur=id;state.form=null;closeDrawer();render(true);}
    else if(a==="back"){state.cur=null;render(true);}
    else if(a==="lang"){state.lang=id;render();}
    else if(a==="cyclelang"){state.lang=state.lang==="de"?"both":state.lang==="both"?"ar":"de";render();}
    else if(a==="mode"){state.mode=id;render();}
    else if(a==="showall"){state.showAll=true;render();}
    else if(a==="timer"&&L){state.live={id:L.id,at:Date.now()};render();}
    else if(a==="stop"){state.live=null;render();}
    else if(a==="resetlesson"&&L){clearLesson(L);render();}
    else if(a==="resetprefix"){var X=findLesson(id);if(X)clearLesson(X);render();toast("Zurückgesetzt");}
    else if(a==="copy"){copyTpl(parseInt(id,10));}
    else if(a==="actlv"){state.actLv=id;render();}
    else if(a==="resetall"){if(confirmReset){state.done={};state.idx={};confirmReset=false;render();toast("Zurückgesetzt");}else{confirmReset=true;render();}}
    else if(a==="clv"){state.curLv=id;render(true);}
    else if(a==="carea"){state.cArea=id;render();}
    else if(a==="cstat"){state.cStat=id;render();}
    else if(a==="mod"){if(!state.modOpen)state.modOpen={};state.modOpen[id]=!state.modOpen[id];render();}
    else if(a==="lolv"){state.loLv=id;render(true);}
    else if(a==="pblv"){state.pbLv=id;render();}
    else if(a==="plv"){state.pLv=id;render();}
    else if(a==="hf"){state.hf=id;render();}
    else if(a==="dlv"){state.dLv=id;render();}
    else if(a==="slv"){state.sLv=id;render();}
    else if(a==="sarea"){state.sArea=id;render();}
    else if(a==="form-cancel"){state.form=null;render();}
    else if(a==="stu-new"){state.form={kind:"stu"};render(true);}
    else if(a==="stu-edit"){state.form={kind:"stu",id:id};state.page="prog";render(true);}
    else if(a==="stu-save"){saveStudent(id);}
    else if(a==="stu-del"){if(state.delConfirm===id){delRec("students",id);state.form=null;state.delConfirm=null;render();toast("Gelöscht");}else{state.delConfirm=id;toast("Zum Löschen nochmal tippen");}}
    else if(a==="err-new"){state.cur=null;state.page="err";state.form={kind:"err",pre:id||""};render(true);}
    else if(a==="err-edit"){state.form={kind:"err",id:id};render(true);}
    else if(a==="err-save"){saveError(id);}
    else if(a==="err-del"){delRec("errors",id);state.form=null;render();toast("Gelöscht");}
    else if(a==="hw-new"){state.cur=null;state.page="hw";state.form={kind:"hw",pre:{student:id||""}};render(true);}
    else if(a==="hw-edit"){state.form={kind:"hw",id:id};render(true);}
    else if(a==="hw-save"){saveHw(id);}
    else if(a==="hw-del"){delRec("homework",id);state.form=null;render();toast("Gelöscht");}
    else if(a==="doc-new"){var pre=id?{lessonId:id,level:(findLesson(id)||{}).lv}:{};state.cur=null;state.page="doc";state.form={kind:"doc",pre:pre};closeDrawer();render(true);}
    else if(a==="doc-edit"){state.form={kind:"doc",id:id,pre:{}};render(true);}
    else if(a==="doc-save"){saveDoc(id);}
    else if(a==="doc-del"){delRec("docs",id);state.form=null;render();toast("Gelöscht");}
    else if(a==="export"){state.io=state.io==="export"?null:"export";render();}
    else if(a==="import"){state.io=state.io==="import"?null:"import";render();}
    else if(a==="import-do"){try{var o=JSON.parse(fv("iotext")),n=0;COLS.forEach(function(c){(o[c]||[]).forEach(function(r){if(r&&r.id){putRec(c,r);n++;}});});state.io=null;render();toast(n+" Einträge importiert");}catch(err){toast("Text ist kein gültiger Export");}}
    else if(a==="migrate"){var n2=0;if(LOCALCOPY)COLS.forEach(function(c){(LOCALCOPY[c]||[]).forEach(function(r){if(r&&r.id&&!findRec(c,r.id)){putRec(c,r);n2++;}});});LOCALCOPY=null;render();toast(n2+" Einträge übertragen");}
    else if(L&&(a==="fdone"||a==="fprev"||a==="fnext")){
      var st=steps(L),ix=state.idx[L.id];if(ix==null||ix<0||ix>=st.length)ix=firstUndone(st,0);
      if(ix===-1)ix=st.length-1;
      if(a==="fdone"){var x=st[ix].x;if(state.done[x.id]){delete state.done[x.id];}else{state.done[x.id]=1;advance(L,ix);}render();}
      else if(a==="fprev"){state.idx[L.id]=Math.max(0,ix-1);render();}
      else{state.idx[L.id]=Math.min(st.length-1,ix+1);render();}
    }
  });
  document.addEventListener("input",function(e){var t=e.target;if(t&&t.id==="q2"){state.q=t.value;var qi2=document.getElementById("q");if(qi2)qi2.value=t.value;clearTimeout(rTimer);rTimer=setTimeout(function(){render();var n=document.getElementById("q2");if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length);}catch(err){}}},250);}});
  document.addEventListener("change",function(e){
    var t=e.target;if(!t||!t.matches)return;
    if(t.matches('input[type="checkbox"][data-id]')){var id=t.getAttribute("data-id");if(t.checked)state.done[id]=1;else delete state.done[id];render();}
    else if(t.matches("input[data-note]")){if(!state.notes)state.notes={};var lid=t.getAttribute("data-note");state.notes[lid]=t.value;putRec("materials",{id:lid,note:t.value});save();toast("Gespeichert");}
    else if(t.matches("input[data-start]")){state.start[t.getAttribute("data-start")]=t.value;save();toast("Gespeichert");}
    else if(t.matches("input[data-showall]")){state.showAll=!!t.checked;render();}
    else if(t.matches("select[data-errst]")){var r=findRec("errors",t.getAttribute("data-errst"));if(r){r=Object.assign({},r,{status:t.value});putRec("errors",r);toast("Status geändert");}}
    else if(t.matches("select[data-hwst]")){var r2=findRec("homework",t.getAttribute("data-hwst"));if(r2){r2=Object.assign({},r2,{status:t.value});putRec("homework",r2);toast("Status geändert");}}
    else if(t.matches("select[data-filter]")){var k=t.getAttribute("data-filter").split(".");if(!state[k[0]])state[k[0]]={};state[k[0]][k[1]]=t.value;render();}
    else if(t.matches("select[data-relevel]")){var cur=state.form&&state.form.id?Object.assign({},findRec("students",state.form.id)):{};cur.level=t.value;cur.module="";cur.name=fv("f_name");app.innerHTML='<div class="ph1"><h1>06 Student Progress</h1></div>'+formStudent(cur);}
    else if(t.matches("select[data-docrelevel]")){state.form.pre={level:t.value,lessonId:""};render();}
    else if(t.matches("select[data-docrelesson]")){state.form.pre={level:fv("f_level"),lessonId:t.value};render();}
  });
  document.addEventListener("focusout",function(){setTimeout(function(){if(pendingRender&&!isTyping())render();},0);});
  render(true);
  initDb();
  tickId=setInterval(updateLive,1000);
});
})();
</script>
